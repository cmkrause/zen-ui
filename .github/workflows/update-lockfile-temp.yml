name: Normalize lockfile (temporary)

on:
  push:
    branches:
      - perf/statistics-fetch-efficiency
    paths:
      - .github/workflows/update-lockfile-temp.yml

permissions:
  contents: write

jobs:
  normalize-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: perf/statistics-fetch-efficiency
          fetch-depth: 0

      - name: Restore original lockfile shape and update only Valibot
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          base = subprocess.check_output(
              ['git', 'show', 'd97790d45378e2c931e47d773d4a861073f3d713^:pnpm-lock.yaml'],
              text=True,
          )
          replacements = {
              'specifier: ^1.2.0': 'specifier: ^1.4.2',
              'version: 1.2.0(typescript@5.9.3)': 'version: 1.4.2(typescript@5.9.3)',
              'valibot@1.2.0:': 'valibot@1.4.2:',
              'sha512-mm1rxUsmOxzrwnX5arGS+U4T25RdvpPjPN4yR0u9pUBov9+zGVtO84tif1eY4r6zWxVxu3KzIyknJy3rxfRZZg==': 'sha512-gjdCvJ6d3RyHAneqxMYMW9QMCwYMb3jpOO0IyHZV1bnRHFBHrX3VkIILt5XYR0WhwHiH7Mty8ovuPZ/O3gamrg==',
              'valibot@1.2.0(typescript@5.9.3):': 'valibot@1.4.2(typescript@5.9.3):',
          }
          for old, new in replacements.items():
              if old not in base:
                  raise SystemExit(f'Missing expected lockfile text: {old}')
              base = base.replace(old, new)
          Path('pnpm-lock.yaml').write_text(base)

      - name: Commit normalized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: normalize Valibot lockfile"
          git push origin HEAD:perf/statistics-fetch-efficiency
