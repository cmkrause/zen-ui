name: Release heatmap sizing test

on:
  push:
    branches:
      - feat/heatmap-sizing
    paths:
      - .github/workflows/release-heatmap-sizing-test.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sizing revision
        uses: actions/checkout@v4
        with:
          ref: c5db816d28a6159c08c035962446e626835e063c

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Publish test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.3.0-cmkrause.sizing.1 dist/zen-ui.js \
            --title "v1.3.0-cmkrause.sizing.1" \
            --target c5db816d28a6159c08c035962446e626835e063c \
            --notes "Sizing-only test build from upstream main. Adds configurable heatmap zoom, card padding, and title gap. No statistics, dependency, or toolchain changes included."
