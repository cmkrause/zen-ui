name: Format changed files (temporary)

on:
  push:
    branches:
      - perf/statistics-fetch-efficiency
    paths:
      - .github/workflows/format-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: perf/statistics-fetch-efficiency

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source files
        run: pnpm exec prettier --write plugin/data-sources/statistics.test.ts plugin/zen-ui.ts

      - name: Commit formatting
        run: |
          if git diff --quiet -- plugin/data-sources/statistics.test.ts plugin/zen-ui.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/data-sources/statistics.test.ts plugin/zen-ui.ts
          git commit -m "style: format statistics changes"
          git push origin HEAD:perf/statistics-fetch-efficiency
