name: Test heatmap sizing branch

on:
  push:
    branches:
      - feat/heatmap-sizing
    paths:
      - .github/workflows/test-heatmap-sizing.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sizing branch
        uses: actions/checkout@v4
        with:
          ref: feat/heatmap-sizing

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format sizing files
        run: pnpm exec prettier --write plugin/cards/heatmap/render.ts plugin/heatmap-sizing.test.ts

      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugin/cards/heatmap/render.ts plugin/heatmap-sizing.test.ts
            git commit -m "style: format heatmap sizing changes"
            git push origin HEAD:feat/heatmap-sizing
          fi

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build
