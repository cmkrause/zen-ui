name: Refresh pnpm 12 lockfile (temporary)

on:
  push:
    branches:
      - perf/statistics-fetch-efficiency
    paths:
      - .github/workflows/refresh-lockfile-temp.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: perf/statistics-fetch-efficiency

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile --lockfile-only

      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: refresh lockfile for pnpm 12"
          git push origin HEAD:perf/statistics-fetch-efficiency
