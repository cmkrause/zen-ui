name: Publish sizing HACS branch

on:
  push:
    branches:
      - feat/heatmap-sizing
    paths:
      - .github/workflows/publish-sizing-hacs-branch.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: v1.3.0-cmkrause.sizing.2
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:run
      - run: pnpm build
      - name: Publish built card to branch root
        run: |
          cp dist/zen-ui.js zen-ui.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zen-ui.js
          git commit -m "build: publish v1.3.0-cmkrause.sizing.2"
          git push origin HEAD:v1.3.0-cmkrause.sizing.2
