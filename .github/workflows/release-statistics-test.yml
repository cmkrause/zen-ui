name: Build statistics-only test release

on:
  push:
    branches:
      - perf/statistics-only
    paths:
      - .github/workflows/release-statistics-test.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout optimization revision
        uses: actions/checkout@v4
        with:
          ref: 9a20a6ea3181672578fbbe610772ad8014bdd1a9

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.0-cmkrause.stats.1 dist/zen-ui.js \
            --repo cmkrause/zen-ui \
            --target 9a20a6ea3181672578fbbe610772ad8014bdd1a9 \
            --title "v1.3.0-cmkrause.stats.1" \
            --notes "Statistics-only test build from upstream main with Recorder types filtering, attribute-data short-circuiting, and one-hour/local-day cache expiry. No dependency or toolchain files changed."
